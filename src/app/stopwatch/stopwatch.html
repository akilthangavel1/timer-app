<div class="text-center mt-10">
  <h1 class="text-3xl font-bold">{{ time() }}s</h1>

  <div class="mt-4 flex justify-center gap-3">
    <button class="bg-green-500 text-white px-4 py-2" (click)="start()"> Start </button>
    <button class="bg-yellow-500 text-white px-4 py-2" (click)="stop()"> Stop </button>
    <button class="bg-red-500 text-white px-4 py-2" (click)="reset()"> Reset </button>
  </div>
</div>
